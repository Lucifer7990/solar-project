<!-- Overlay -->
<div *ngIf="popupService.isOpen()" class="fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6 overflow-y-auto">
  
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-md transition-opacity" (click)="closePopup()"></div>
  
  <!-- Modal Content -->
  <div class="relative bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden transform transition-all flex flex-col my-auto max-h-[calc(100vh-2rem)]"
       role="dialog" aria-modal="true" aria-labelledby="modal-headline">
       
    <!-- Close Button -->
    <button (click)="closePopup()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 transition-colors bg-slate-100 hover:bg-slate-200 rounded-full w-8 h-8 flex items-center justify-center focus:outline-none z-10">
      <i class="ph ph-x text-xl"></i>
    </button>
    
    <!-- Modal Header -->
    <div class="px-5 pt-6 pb-2 sm:px-8 sm:pt-8 sm:pb-4 text-center">
      <div class="inline-flex items-center justify-center w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-brand-gold/20 mb-2 sm:mb-4">
        <i class="ph-fill ph-lightning text-brand-gold text-xl sm:text-2xl"></i>
      </div>
      <h3 class="text-xl sm:text-2xl leading-6 font-extrabold text-brand-navy" id="modal-headline">
        Get Your Free Quote
      </h3>
      <p class="mt-1 sm:mt-2 text-xs sm:text-sm text-slate-500">
        Enter your details below and our team will get back to you with a custom solar solution.
      </p>
    </div>

    <!-- Modal Body -->
    <div class="px-5 pb-6 sm:px-8 sm:pb-8 overflow-y-auto">
      
      <!-- Success Message -->
      <div *ngIf="submitSuccess()" class="bg-green-50 border-l-4 border-green-500 p-6 rounded-xl flex items-start">
        <i class="ph-fill ph-check-circle text-green-500 mr-3 text-xl"></i>
        <div>
          <h4 class="text-green-800 font-bold mb-1">Success!</h4>
          <p class="text-green-700 text-sm">Your request has been sent successfully. We'll be in touch soon.</p>
        </div>
      </div>

      <!-- Error Message -->
      <div *ngIf="submitError()" class="bg-red-50 border-l-4 border-red-500 p-4 rounded-xl flex items-start mb-4">
        <i class="ph-fill ph-warning-circle text-red-500 mr-3 text-xl"></i>
        <div>
          <h4 class="text-red-800 font-bold mb-1">Error</h4>
          <p class="text-red-700 text-sm">{{ errorMessage() }}</p>
        </div>
      </div>

      <!-- The Form -->
      <form *ngIf="!submitSuccess()" class="space-y-3 sm:space-y-4" (ngSubmit)="submitForm()" #popupForm="ngForm">
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Name *</label>
            <input type="text" [ngModel]="name()" (ngModelChange)="name.set($event)" name="name" required
              class="w-full px-3 py-2 sm:px-4 sm:py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-brand-gold focus:border-brand-gold outline-none transition-all bg-slate-50 focus:bg-white text-sm sm:text-base"
              placeholder="John Doe">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Phone *</label>
            <input type="tel" [ngModel]="phone()" (ngModelChange)="phone.set($event)" name="phone" required
              class="w-full px-3 py-2 sm:px-4 sm:py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-brand-gold focus:border-brand-gold outline-none transition-all bg-slate-50 focus:bg-white text-sm sm:text-base"
              placeholder="0400 000 000">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Email *</label>
          <input type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" name="email" required
            class="w-full px-3 py-2 sm:px-4 sm:py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-brand-gold focus:border-brand-gold outline-none transition-all bg-slate-50 focus:bg-white text-sm sm:text-base"
            placeholder="john@example.com">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Message</label>
          <textarea [ngModel]="message()" (ngModelChange)="message.set($event)" name="message" rows="2"
            class="w-full px-3 py-2 sm:px-4 sm:py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-brand-gold focus:border-brand-gold outline-none transition-all bg-slate-50 focus:bg-white resize-none text-sm sm:text-base"
            placeholder="How can we help you?"></textarea>
        </div>

        <!-- CAPTCHA -->
        <div class="flex items-center gap-3 sm:gap-4 bg-slate-50 p-3 sm:p-4 rounded-xl border border-slate-200">
          <label class="block text-sm font-bold text-slate-700 whitespace-nowrap">
            What is {{ num1() }} + {{ num2() }}? *
          </label>
          <input type="number" [ngModel]="captchaAnswer()" (ngModelChange)="captchaAnswer.set($event)" name="captchaAnswer" required
            class="w-24 px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg border focus:ring-2 focus:ring-brand-gold focus:border-brand-gold outline-none transition-all"
            [ngClass]="captchaError() ? 'border-red-500 bg-red-50 text-red-900' : 'border-slate-300 bg-white'">
        </div>
        <p *ngIf="captchaError()" class="text-red-500 text-xs mt-1 font-medium">Incorrect answer, please try again.</p>

        <!-- Submit Button -->
        <button type="submit" [disabled]="!popupForm.form.valid || isSubmitting()"
          class="w-full flex justify-center items-center py-3 sm:py-4 px-6 sm:px-8 border border-transparent text-base sm:text-lg font-bold rounded-xl text-brand-navy bg-brand-gold hover:bg-brand-gold-light focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-gold transition-all duration-300 shadow-md hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed mt-4 sm:mt-6">
          <i class="ph ph-spinner mr-2 animate-spin text-xl" *ngIf="isSubmitting()"></i>
          {{ isSubmitting() ? 'Sending...' : 'Request Quote' }}
        </button>
      </form>
      
    </div>
  </div>
</div>
