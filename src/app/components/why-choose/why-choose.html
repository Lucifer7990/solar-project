<section class="py-12 bg-slate-50">
  <div class="max-w-7xl mx-auto px-6">
    <div class="grid lg:grid-cols-2 gap-16 items-center" appScrollReveal>
      <div class="relative rounded-3xl overflow-hidden shadow-2xl h-[500px]">
        <div
          class="absolute inset-0 bg-cover bg-center"
          [style.background-image]="'url(' + data.images.whyChooseBg + ')'"
        ></div>
      </div>

      <div>
        <h3 class="text-2xl md:text-4xl font-extrabold text-slate-800 mb-8">Why Choose Us?</h3>

        <div class="grid gap-4">
          @for (item of whyChoose; track item) {
            <div
              class="flex items-center gap-4 bg-white rounded-2xl p-5 shadow-sm border border-slate-100 hover:border-brand-gold transition-colors"
            >
              <!-- Material Symbol Checkmark -->
              <div class="w-8 h-8 rounded-full bg-brand-gold/10 flex items-center justify-center text-brand-gold">
                <i class="ph-fill ph-check-circle text-xl"></i>
              </div>
              <p class="text-lg font-semibold text-slate-700">{{ item }}</p>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</section>
